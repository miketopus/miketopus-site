<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>miketopus — Coming Soon</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/coming-soon.css">
</head>
<body class="page-coming-soon">

  <!-- ─── Header text ──────────────────────────────────────────── -->
  <div class="cs-header">
    <p class="cs-commit">commit: "init —— redesigning how I show up online"</p>
    <p class="cs-sub">// author: miketopus · branch: main · status: rebuilding from scratch</p>
  </div>

  <!-- ─── Spacer — creates flow height so footer lands in the right place -->
  <div class="cs-spacer"></div>

  <!-- ─── Subscribe form ──────────────────────────────────────── -->
  <div class="cs-form">
    <h2 class="cs-form-title">// Subscribe to the broadcast</h2>
    <form class="cs-form-field" action="#" novalidate>
      <input class="cs-form-input" type="email" placeholder="[tu@email.com]" aria-label="Email">
      <button class="cs-form-btn" type="submit" aria-label="Subscribe">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </form>
    <p class="cs-form-sub">3 wallpapers. Hand-illustrated. For the first few customers only.</p>
  </div>

  <!-- ─── Parallax visual elements (absolute, overlap footer) ──── -->
  <img class="cs-letters"  src="assets/coming-soon/mike-splash.png"   alt="mike" aria-hidden="true">
  <img class="cs-monkey"   src="assets/coming-soon/monkey-mike.png"   alt="" aria-hidden="true">
  <img class="cs-atari"    src="assets/coming-soon/control-atari.png" alt="" aria-hidden="true">
  <img class="cs-claude"   src="assets/coming-soon/claude-vector.svg" alt="" aria-hidden="true">

  <!-- ─── Footer ──────────────────────────────────────────────── -->
  <footer class="site-footer">
    <div class="footer-space" aria-hidden="true"></div>
    <div class="bar-footer">

      <!-- Social icons — same as site-header DS pattern -->
      <div class="header-social">
        <a href="https://www.instagram.com/miketopus" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="assets/icons/instagram.svg" alt="Instagram" width="20" height="20"></a>
        <a href="https://dribbble.com/miketopus"      class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Dribbble"><img src="assets/icons/dribbble.svg"   alt="Dribbble"  width="20" height="20"></a>
        <a href="https://unsplash.com/es/@miketopus"  class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Unsplash"><img src="assets/icons/unsplash.svg"   alt="Unsplash"  width="20" height="20"></a>
        <a href="https://figma.com/@miketopus"        class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Figma"><img src="assets/icons/figma.svg"         alt="Figma"     width="20" height="20"></a>
      </div>

      <p class="cs-broadcast">miketopus broadcasting on <span class="cs-bracket">[</span><span class="cs-date">08·08·2026</span><span class="cs-bracket">]</span> <span class="cs-date">on Twitch.</span></p>

    </div>
  </footer>

  <script src="js/coming-soon.js" defer></script>
</body>
</html>
