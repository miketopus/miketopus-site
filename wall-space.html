<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall Space — Estudio de tatuaje en Bogotá</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/components/site-header.js" defer></script>
  <script src="js/components/site-footer.js" defer></script>
</head>
<body class="page-wallspace">

  <site-header page="wall-space"></site-header>

  <!-- ─── Hero / Coming Soon ───────────────────────────────────── -->
  <section class="ws-hero">
    <div class="ws-gradient" aria-hidden="true">
      <img src="https://www.figma.com/api/mcp/asset/a2e2472c-dc51-44fb-b17e-2cf8bc8ee3a2" alt="">
    </div>
    <p class="ws-coming-soon" aria-hidden="true">comming soon</p>
    <div class="ws-sparkle-lg" aria-hidden="true">
      <img src="https://www.figma.com/api/mcp/asset/752152c1-0067-4d90-b350-2fe4b4c040eb" alt="">
    </div>
    <div class="ws-sparkle-sm" aria-hidden="true">
      <img src="https://www.figma.com/api/mcp/asset/ac56dfef-67e6-49fe-96bd-500de494a567" alt="">
    </div>
    <div class="ws-logo-wrap">
      <img class="ws-logo-isotype" src="https://www.figma.com/api/mcp/asset/a6d8708f-096b-440b-af0c-cde89c7ac1aa" alt="" aria-hidden="true">
      <img class="ws-logo-wordmark" src="https://www.figma.com/api/mcp/asset/28d9e2db-019c-4fc9-9ea3-28bcec8ae897" alt="wall space">
    </div>
    <p class="ws-description">
      Estudio de tatuaje en Bogotá.<br>
      Citas por solicitud, diseño exclusivo por cliente.
    </p>
  </section>

  <!-- ─── "tattoo" Typographic Section ────────────────────────── -->
  <section class="ws-tattoo-section" aria-label="tattoo studio">
    <span class="ws-tattoo-word" aria-hidden="true">tattoo</span>
    <img class="ws-tattoo-monstera" src="https://www.figma.com/api/mcp/asset/d6def1c7-a218-4f5f-bb31-e62533881457" alt="" aria-hidden="true">
    <div class="ws-tattoo-purple-fade" aria-hidden="true"></div>
    <p class="ws-studio-text" aria-hidden="true">studio</p>
    <p class="ws-location">Bogotá, Colombia.</p>
    <div class="ws-art-btn" aria-hidden="true">art</div>
  </section>

  <!-- ─── Photo Cards ──────────────────────────────────────────── -->
  <section class="ws-cards-section" aria-label="Galería de tatuajes">
    <article class="ws-card ws-card-1">
      <img src="https://www.figma.com/api/mcp/asset/dda2f75b-6e00-4920-8715-18c7d4eb3c18" alt="Tatuaje en blanco y negro">
    </article>
    <article class="ws-card ws-card-2">
      <img src="https://www.figma.com/api/mcp/asset/d7afaef7-2aac-40aa-814f-0a7856e733e3" alt="Tatuaje a color">
    </article>
    <div class="ws-label ws-label-design" aria-hidden="true">design</div>
    <div class="ws-label ws-label-ink"    aria-hidden="true">ink</div>
    <div class="ws-label ws-label-music"  aria-hidden="true">music</div>
  </section>

  <site-footer></site-footer>

</body>
</html>
