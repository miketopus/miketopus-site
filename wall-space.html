<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall Space — Estudio de tatuaje en Bogotá</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-wallspace">

  <!-- ─── Header ──────────────────────────────────────────────── -->
  <header class="site-header">
    <a href="index.html" class="header-logo" aria-label="miketopus home">
      <img
        src="https://www.figma.com/api/mcp/asset/adea3e44-c554-4037-89b8-6249a708bd91"
        alt="miketopus"
      >
    </a>

    <nav class="header-nav" aria-label="Main navigation">
      <a href="work.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="3" width="20" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 21h8M12 16v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        work
      </a>
      <a href="wall-space.html" class="nav-item active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 21V10l9-7 9 7v11H3z" stroke="currentColor" stroke-width="1.5"/>
          <rect x="9" y="14" width="6" height="7" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        wallspace
      </a>
      <a href="about.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M4 21c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        about
      </a>
    </nav>

    <div class="header-social">
      <a href="https://instagram.com" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <img src="https://www.figma.com/api/mcp/asset/732d254c-03cc-42c9-a0ce-e10a716249aa" alt="Instagram" width="20" height="20">
      </a>
      <a href="https://dribbble.com" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Dribbble">
        <img src="https://www.figma.com/api/mcp/asset/6f9214a7-33bc-4588-8b7d-118a928db5d1" alt="Dribbble" width="20" height="20">
      </a>
      <a href="https://unsplash.com" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Unsplash">
        <img src="https://www.figma.com/api/mcp/asset/34d1da4c-f6f9-46e1-85ae-cc2e38a7596e" alt="Unsplash" width="20" height="20">
      </a>
    </div>
  </header>

  <!-- ─── Hero / Coming Soon ───────────────────────────────────── -->
  <section class="ws-hero">
    <!-- Background gradient -->
    <div class="ws-gradient" aria-hidden="true">
      <img src="https://www.figma.com/api/mcp/asset/a2e2472c-dc51-44fb-b17e-2cf8bc8ee3a2" alt="">
    </div>

    <!-- Ghost "comming soon" text -->
    <p class="ws-coming-soon" aria-hidden="true">comming soon</p>

    <!-- Sparkle decorations -->
    <div class="ws-sparkle-lg" aria-hidden="true">
      <img src="https://www.figma.com/api/mcp/asset/752152c1-0067-4d90-b350-2fe4b4c040eb" alt="">
    </div>
    <div class="ws-sparkle-sm" aria-hidden="true">
      <img src="https://www.figma.com/api/mcp/asset/ac56dfef-67e6-49fe-96bd-500de494a567" alt="">
    </div>

    <!-- Wall Space Logo -->
    <div class="ws-logo-wrap">
      <img
        class="ws-logo-isotype"
        src="https://www.figma.com/api/mcp/asset/a6d8708f-096b-440b-af0c-cde89c7ac1aa"
        alt=""
        aria-hidden="true"
      >
      <img
        class="ws-logo-wordmark"
        src="https://www.figma.com/api/mcp/asset/28d9e2db-019c-4fc9-9ea3-28bcec8ae897"
        alt="wall space"
      >
    </div>

    <!-- Description -->
    <p class="ws-description">
      Estudio de tatuaje en Bogotá.<br>
      Citas por solicitud, diseño exclusivo por cliente.
    </p>
  </section>

  <!-- ─── "tattoo" Typographic Section ────────────────────────── -->
  <section class="ws-tattoo-section" aria-label="tattoo studio">
    <span class="ws-tattoo-word" aria-hidden="true">tattoo</span>
    <img
      class="ws-tattoo-monstera"
      src="https://www.figma.com/api/mcp/asset/d6def1c7-a218-4f5f-bb31-e62533881457"
      alt=""
      aria-hidden="true"
    >
    <div class="ws-tattoo-purple-fade" aria-hidden="true"></div>
    <p class="ws-studio-text" aria-hidden="true">studio</p>
    <p class="ws-location">Bogotá, Colombia.</p>
    <div class="ws-art-btn" aria-hidden="true">art</div>
  </section>

  <!-- ─── Photo Cards ──────────────────────────────────────────── -->
  <section class="ws-cards-section" aria-label="Galería de tatuajes">
    <!-- Card 1 — black & white tattoo -->
    <article class="ws-card ws-card-1">
      <img
        src="https://www.figma.com/api/mcp/asset/dda2f75b-6e00-4920-8715-18c7d4eb3c18"
        alt="Tatuaje en blanco y negro"
      >
    </article>

    <!-- Card 2 — colorful tattoo -->
    <article class="ws-card ws-card-2">
      <img
        src="https://www.figma.com/api/mcp/asset/d7afaef7-2aac-40aa-814f-0a7856e733e3"
        alt="Tatuaje a color"
      >
    </article>

    <!-- Floating italic labels -->
    <div class="ws-label ws-label-design" aria-hidden="true">design</div>
    <div class="ws-label ws-label-ink"    aria-hidden="true">ink</div>
    <div class="ws-label ws-label-music"  aria-hidden="true">music</div>
  </section>

  <!-- ─── Footer Bar ───────────────────────────────────────────── -->
  <footer>
    <div class="bar-footer">
      <span>All Rights Reserved  ©2024</span>
      <a href="wall-space.html">Wall Space Store</a>
    </div>
  </footer>

</body>
</html>
